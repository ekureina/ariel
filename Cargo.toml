[package]
name = "ariel"
version = "0.2.0"
edition = "2024"
license = "Apache-2.0"

[dependencies]
chrono = "0.4.41"
chrono-tz = { version = "0.10.3", features = ["case-insensitive"] }
clap = { version = "4.5.37", features = ["derive", "env", "wrap_help"] }
poise = "0.6.1"
rand = "0.9.1"
sea-orm = { version = "1.1.10", features = ["runtime-tokio", "sqlx-all"] }
sea-orm-migration = "1.1.10"
serde = "1.0.219"
serde_json = "1.0.140"
shlex = "1.3.0"
thiserror = "2.0.12"
tokio = { version = "1.44.2", features = ["macros", "rt-multi-thread", "io-std", "sync"] }
tracing = "0.1.41"
tracing-log = "0.2.0"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }

[lints.rust]
nonstandard_style = "deny"
deprecated_in_future = "deny"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = "deny"
pedantic = "warn"
